name: Build APK Android

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Installer une clé de signature debug stable
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Générer les dossiers Android (gradle, manifest, etc.)
        run: flutter create --platforms=android --org com.motovisite .

      - name: Ajouter les permissions nécessaires au manifest
        run: python3 scripts/patch_android_manifest.py

      - name: Fixer compileSdk/targetSdk à une version récente
        run: python3 scripts/patch_android_build_gradle.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze || true

      - name: Compiler l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: visite-pv-batterie-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publier l'APK dans une Release (téléchargement direct, sans zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="APK généré automatiquement depuis le commit ${{ github.sha }}. Téléchargez app-release.apk ci-dessous et installez-le directement sur votre téléphone."
          if gh release view apk-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload apk-latest build/app/outputs/flutter-apk/app-release.apk --repo "${{ github.repository }}" --clobber
            gh release edit apk-latest --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create apk-latest build/app/outputs/flutter-apk/app-release.apk \
              --repo "${{ github.repository }}" \
              --title "Dernière build APK" \
              --notes "$NOTES" \
              --prerelease
          fi
