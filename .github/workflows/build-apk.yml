name: Build APK Android

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer les dossiers Android (gradle, manifest, etc.)
        run: flutter create --platforms=android --org com.motovisite .

      - name: Ajouter les permissions nécessaires au manifest
        run: python3 scripts/patch_android_manifest.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze || true

      - name: Compiler l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: visite-pv-batterie-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
